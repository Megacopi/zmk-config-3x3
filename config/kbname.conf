# USB-HID Priorität
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n                    # BLE komplett deaktivieren — nicht nötig, spart Boot-Zeit

# USB-HID Low-latency (wichtig für Pre-OS)
CONFIG_USB_DEVICE_MANUFACTURER="ZMK Project"
CONFIG_USB_DEVICE_PRODUCT="MacroPad GRUB"
CONFIG_USB_DEVICE_VID=0x1D50
CONFIG_USB_DEVICE_PID=0x615E

# Kein BLE-Init beim Start → schnellere USB-Enumeration
# (die BT-spezifischen Optionen aus deiner alten Config entfallen)

# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="MacroPad GRUB"

# DCDC aus (dein Klon braucht das)
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n

# RC-Oszillator (für SuperMini-Klone ohne 32kHz-Quarz)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n