# --- BLUETOOTH FIXES ---
# 1. Maximale Sendeleistung
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2. WICHTIG: Erzwinge internen Taktgeber (falls Quarz fehlt/kaputt ist)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# 3. DER GEHEIMTIPP: Deaktiviere den DCDC-Regler
# (Viele Clones haben schlechte Regler -> Bluetooth stürzt ab)
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n

# --- SYSTEM SETTINGS ---
# Erlaubt tieferen Schlafmodus
CONFIG_ZMK_SLEEP=y

# --- DEBUGGING (Optional) ---
# Falls du sehen willst, was passiert (braucht USB Console)
# CONFIG_ZMK_USB_LOGGING=y
