# === DER RETTUNGS-ANKER ===

# 1. Quarz-Fix (Zwingend für SuperMini!)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# 2. Sendeleistung auf Maximum
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 3. DCDC-Wandler aus (Stabilitäts-Fix)
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n

# 4. WICHTIG: Lösche ALLE Bluetooth-Verbindungen bei JEDEM Start
# (Das ist der "Brute Force" Weg, um Pairing-Probleme zu umgehen)
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y

# 5. System
CONFIG_ZMK_KEYBOARD_NAME="SuperPad TEST"
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
