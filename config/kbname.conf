# === SUPERMINI RETTUNGS-CONFIG ===

# 1. Erzwinge die interne Uhr (WICHTIGSTES FEATURE!)
# Ohne das startet Bluetooth nicht, wenn der Quarz fehlt.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# 2. Deaktiviere den DCDC-Wandler
# Viele SuperMinis stürzen ab, wenn dieser an ist.
CONFIG_BOARD_ENABLE_DCDC=n
CONFIG_BOARD_ENABLE_DCDC_HV=n

# 3. Bluetooth-Leistung auf Maximum
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 4. Erhöhe die Bluetooth-Kompatibilität (Experimental Features)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 5. Debugging (Optional - nur aktivieren, wenn es immer noch nicht geht)
# Falls du das aktivierst: Das Gerät taucht als "USB Serial Device" auf.
# CONFIG_ZMK_USB_LOGGING=y
